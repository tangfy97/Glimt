name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check the project file is up to date
        run: |
          xcodegen generate
          git diff --exit-code Glimt.xcodeproj
      - name: Unit tests
        run: xcodebuild test -project Glimt.xcodeproj -scheme Glimt -derivedDataPath build/DerivedData.noindex
      - name: Self-test
        run: scripts/selftest.sh
