name: Glimt
options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
# AppStore is Release in the App Sandbox, for the Mac App Store. Release (Developer ID, GitHub)
# stays outside the sandbox so it can open any folder without asking.
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Glimt:
    type: application
    platform: macOS
    sources:
      - path: Glimt
    scheme:
      testTargets:
        - GlimtTests
    settings:
      configs:
        # Hardened runtime would refuse to load the ad-hoc signed test bundle into the app.
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        AppStore:
          ENABLE_APP_SANDBOX: YES
          CODE_SIGN_ENTITLEMENTS: Glimt/Glimt-AppStore.entitlements
      base:
        # Forks: change to your own reverse-DNS ID (the app reads it from here) and Team.
        PRODUCT_BUNDLE_IDENTIFIER: com.feiyangtang.Glimt
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        INFOPLIST_FILE: Glimt/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Glimt
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 TangSpark. Apache License 2.0."
        # Not sandboxed: a Creevey-style sorter must browse a photo's siblings and
        # move files into arbitrary folders, which the sandbox makes awkward.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GlimtTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GlimtTests
    dependencies:
      - target: Glimt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.feiyangtang.GlimtTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Glimt.app/Contents/MacOS/Glimt"
        BUNDLE_LOADER: "$(TEST_HOST)"
